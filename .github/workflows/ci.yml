name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The VCS core is pure stdlib, so it must work across supported
        # Pythons without the ML stack installed.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (base only — deliberately no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check aethel/ tests/

      - name: Test
        run: pytest tests/ -q

      - name: Coverage (core must stay well covered)
        run: |
          pytest tests/ --cov=aethel.core --cov-report=term-missing \
            --cov-fail-under=80
