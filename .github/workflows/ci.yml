name: CI

on:
  push:
  pull_request:

jobs:
  # The VCS core is pure stdlib. This job installs no fastapi and no torch, so
  # it fails if the core ever grows a dependency on either -- and the Hub tests
  # skip here by design.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (base only; deliberately no torch, no fastapi)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest tests/

      - name: Coverage (core must stay well covered)
        run: |
          pytest tests/ --cov=aethel.core --cov-report=term-missing \
            --cov-fail-under=80

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training dependencies
        run: |
          python -m pip install 'torch>=2.2,<3.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,ml]'
      - name: Confirm ML imports
        run: python -c "import torch, transformers, peft, safetensors"
      - name: Test training, evaluation, and diff without downloads
        run: pytest tests/test_training_pipeline.py tests/test_evaluation.py tests/test_evaluation_protocol.py tests/test_adapter_diff.py

  # Without this job the Hub's tests would skip on every run and CI would stay
  # green through a broken Hub -- a passing suite that proved nothing.
  hub:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the Hub extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hub]"

      - name: Lint everything
        run: ruff check .

      # The Hub's tests skip themselves when fastapi is absent, which would let
      # CI stay green through a Hub that does not even import. Asserting the
      # import first means a broken extra fails here, loudly, instead of
      # disappearing into a skip count.
      - name: Confirm the Hub imports
        run: python -c "import fastapi.testclient, httpx, jinja2, hub.app"

      - name: Test
        run: pytest tests/

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild and compare the contract artifact
        run: |
          npm ci --prefix contracts --ignore-scripts
          npm run --prefix contracts build
          git diff --exit-code -- aethel/provenance/contracts/AethelCheckpoint.json
      - name: Install provenance and HTTP test dependencies
        run: python -m pip install -e '.[dev,hub,provenance-test,fonts]'
      - name: Test contract execution, mirrors, and dashboard integration
        run: pytest tests/test_provenance_chain.py tests/test_provenance_ipfs.py tests/test_provenance_hub.py tests/test_hub_credentials.py
