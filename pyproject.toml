[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethel"
version = "0.2.0"
description = "Version control and provenance for LoRA adapters"
readme = "README.md"
requires-python = ">=3.10"

# Base install deliberately excludes torch/transformers. The VCS core
# (objects, refs, commits, fsck) is pure stdlib, so `pip install -e .`
# gives a working repository tool and a fast CI job. ML lives in [ml].
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "PyYAML>=6.0,<7.0",
    "huggingface-hub>=0.26,<1.0",
    # `aethel push` talks to the Hub. Base, not an extra: publishing is part of
    # the VCS, and httpx is pure Python with no build step.
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Running the Hub server. A client only needs the base install, so a demo
# machine that just pushes never installs FastAPI.
hub = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
]
ml = [
    "torch>=2.2,<3.0",
    # >=4.46 required: Trainer(processing_class=...) replaced tokenizer=
    "transformers>=4.46,<5.0",
    "peft>=0.13,<1.0",
    "datasets>=3.0,<5.0",
    "safetensors>=0.4,<1.0",
    "accelerate>=0.34,<2.0",
    "scikit-learn>=1.4,<2.0",
]
# CUDA-only. Never in base: it breaks CPU and macOS installs outright.
gpu = ["bitsandbytes>=0.43,<1.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
aethel = "aethel.main:app"

[tool.setuptools.packages.find]
# Explicit include so aethel.core ships. A bare find_packages() combined with
# a missing aethel/core/__init__.py silently excluded the core package from
# installs.
include = ["aethel*", "hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "ml: requires the [ml] extra (torch/transformers) to be installed",
    "network: requires network access",
]

[tool.coverage.run]
source = ["aethel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
]
