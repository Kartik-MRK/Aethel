# Tweet Eval Hate Speech Detection: Binary (hateful / not hateful)
# Compatible with: aethel train --config train_yaml/tweet_eval_hate_config.yaml

dataset: ./datasets/tweet_eval_hate
text_column: text
label_column: label
num_labels: 2
max_samples: 500
max_length: 128

# LoRA hyperparameters (safe for 6 GB VRAM)
lora_rank: 8
lora_alpha: 16
batch_size: 2
gradient_accumulation_steps: 8
epochs: 1
